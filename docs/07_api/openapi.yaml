openapi: 3.0.3
info:
  title: ReplaceFlow API
  version: 0.1.0
  description: |
    **ReplaceFlow** — 반도체 설비 부품 교체 승인 프로세스 에이전트 REST API.

    - 작업요청(WorkRequest) 생성 → 오케스트레이터가 4개 에이전트(SPEC/LEGAL/SAFETY_DOC/VENDOR)를 비동기 실행
    - `POST /work-requests/{id}/agent-runs` 는 **202 Accepted** + `run_id` 를 반환하고, 클라이언트는 `GET /agent-runs/{runId}` 를 3초 간격으로 폴링한다.
    - 에이전트는 정보 수집·초안 작성만 수행하며, 승인(APPROVE)은 안전관리자가 체크리스트 4항목을 모두 확인해야 가능하다(Human-in-the-loop).
    - Mock 동작: `POST …/agent-runs` 직후 steps 4개 모두 `PENDING`, 이후 `GET /agent-runs/{runId}` 호출마다 SPEC→LEGAL→SAFETY_DOC→VENDOR 순으로 step 하나가 `DONE`. 4개 모두 DONE 이면 `overall_status=REVIEW`.
  contact:
    name: ReplaceFlow Team (SKALA mini project)
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
security:
  - bearerAuth: []
servers:
  - url: http://localhost:8000/api/v1
    description: 로컬 개발 서버 (FastAPI)
  - url: https://{mockId}.mock.pstmn.io/api/v1
    description: Postman Mock Server
    variables:
      mockId:
        default: replaceflow

tags:
  - name: work-requests
    description: 작업요청(설비 부품 교체 요청) 리소스
  - name: agent-runs
    description: 에이전트 실행(오케스트레이터 run) 리소스 — 비동기 폴링
  - name: approvals
    description: 안전관리자 승인/반려/보완요청
  - name: documents
    description: 에이전트가 생성한 안전 서류·RFQ 초안
  - name: parts
    description: 부품 및 호환표
  - name: equipments
    description: 설비 마스터
  - name: laws
    description: 법령 인덱스(법제처 사전 적재) 검색
  - name: dashboard
    description: KPI 대시보드
  - name: tenants
    description: 테넌트별 AI 설정(에이전트별 모델·egress)

paths:
  /work-requests:
    get:
      tags: [work-requests]
      summary: 작업요청 목록 조회
      description: 상태 필터·페이지네이션을 지원하는 작업요청 목록. 화면1(목록/대시보드) 테이블에 사용.
      operationId: listWorkRequests
      parameters:
        - name: status
          in: query
          description: 작업요청 상태 필터 (미지정 시 전체)
          required: false
          schema:
            $ref: '#/components/schemas/WorkRequestStatus'
        - name: page
          in: query
          description: 페이지 번호 (1부터)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 페이지 크기
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 작업요청 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestList'
              examples:
                default:
                  $ref: '#/components/examples/WorkRequestListExample'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [work-requests]
      summary: 작업요청 생성
      description: 설비·부품·증상·현장 확인 결과를 입력해 작업요청을 생성한다 (UC-01). 생성 직후 상태는 `REQUESTED`.
      operationId: createWorkRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequestCreate'
            example:
              equipment_id: EQ-GC-02
              part_id: P-VLV-001
              symptom: 가스 유량 이상, 밸브 누설 의심
              site_check_note: 현장 확인 결과 밸브 시트 마모
              requested_by: U-001
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: 생성된 작업요청
          headers:
            Location:
              description: 생성된 리소스 URI
              schema:
                type: string
                example: /api/v1/work-requests/WR-20260902-011
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequest'
              examples:
                default:
                  $ref: '#/components/examples/WorkRequestExample'
        '422':
          $ref: '#/components/responses/ValidationError'

  /work-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkRequestId'
    get:
      tags: [work-requests]
      summary: 작업요청 상세 조회
      description: 요청 정보 + 최신 에이전트 실행(`latest_run`) + 승인 이력(`approvals`)을 한 번에 반환. 화면2(타임라인+승인 패널)의 초기 로딩용.
      operationId: getWorkRequest
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 작업요청 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestDetail'
              examples:
                default:
                  $ref: '#/components/examples/WorkRequestDetailExample'
        '404':
          $ref: '#/components/responses/NotFound'

  /work-requests/{id}/agent-runs:
    parameters:
      - $ref: '#/components/parameters/WorkRequestId'
    post:
      tags: [agent-runs]
      summary: 에이전트 실행 시작 (비동기)
      description: |
        오케스트레이터가 SPEC/LEGAL/SAFETY_DOC/VENDOR 4개 에이전트 실행을 시작한다 (UC-02).
        처리는 비동기이므로 **202 Accepted** 와 `run_id` 만 즉시 반환하고, 결과는 `GET /agent-runs/{runId}` 로 폴링한다.
        작업요청 상태는 `RUNNING` 으로 전이된다. 이미 `APPROVED`/`DONE` 인 요청에는 실행할 수 없다(409).
      operationId: startAgentRun
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '202':
          description: 실행 접수됨. 결과는 폴링으로 확인.
          headers:
            Location:
              description: 폴링할 AgentRun 리소스 URI
              schema:
                type: string
                example: /api/v1/agent-runs/RUN-0042
            Retry-After:
              description: 권장 폴링 간격(초)
              schema:
                type: integer
                example: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunAccepted'
              example:
                run_id: RUN-0042
                overall_status: RUNNING
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 상태 충돌 — 작업요청이 이미 `APPROVED` 또는 `DONE` 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_STATE
                message: 이미 승인(APPROVED) 또는 완료(DONE)된 작업요청에는 에이전트를 실행할 수 없습니다.
                details:
                  current_status: APPROVED

  /agent-runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        description: 에이전트 실행 ID
        schema:
          type: string
          example: RUN-0042
    get:
      tags: [agent-runs]
      summary: 에이전트 실행 상태·결과 조회 (폴링)
      description: |
        steps 별 `PENDING/RUNNING/DONE/FAILED` 상태와 결과 JSON. FE 는 이 JSON 만 알면 된다(Interface First).
        Mock: 호출마다 다음 step 하나가 `DONE` 으로 전이(SPEC→LEGAL→SAFETY_DOC→VENDOR). 4개 모두 DONE 이면 `overall_status=REVIEW`.
      operationId: getAgentRun
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 에이전트 실행 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
              examples:
                done4:
                  $ref: '#/components/examples/AgentRunExample'
                done0:
                  summary: 0/4 완료 (직후)
                  value:
                    run_id: RUN-0042
                    work_request_id: WR-20260902-011
                    overall_status: RUNNING
                    steps:
                      - { agent: SPEC, status: PENDING, started_at: null, completed_at: null, result: null }
                      - { agent: LEGAL, status: PENDING, started_at: null, completed_at: null, result: null }
                      - { agent: SAFETY_DOC, status: PENDING, started_at: null, completed_at: null, result: null }
                      - { agent: VENDOR, status: PENDING, started_at: null, completed_at: null, result: null }
                    summary: null
                    approval_required_by: SAFETY_MANAGER
                    model_name: mock-v1
                    prompt_version: replaceflow-v0.1
                    created_at: '2026-09-02T15:10:02+09:00'
                    completed_at: null
        '404':
          $ref: '#/components/responses/NotFound'

  /work-requests/{id}/submit-approval:
    parameters:
      - $ref: '#/components/parameters/WorkRequestId'
    patch:
      tags: [work-requests]
      summary: 승인 요청 제출 (REVIEW → PENDING_APPROVAL)
      description: |
        엔지니어가 에이전트 결과를 검토하고 누락 정보를 보완한 뒤 안전관리자에게 승인을 요청한다 (UC-03).
        - 에이전트 run 이 아직 `REVIEW` 가 아니면(미완료) **409**
        - 서류의 `missing` 항목이 남아 있으면 **422** (누락 항목 목록을 `details.missing` 에 반환)
      operationId: submitApproval
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitApprovalBody'
            example:
              missing_info:
                작업자 2명 이름: 김민준, 박수진
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 상태가 `PENDING_APPROVAL` 로 전이된 작업요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequest'
              example:
                id: WR-20260902-011
                tenant_id: T-001
                equipment_id: EQ-GC-02
                part_id: P-VLV-001
                symptom: 가스 유량 이상, 밸브 누설 의심
                site_check_note: 현장 확인 결과 밸브 시트 마모
                requested_by: U-001
                status: PENDING_APPROVAL
                created_at: '2026-09-02T15:00:00+09:00'
                updated_at: '2026-09-02T15:30:00+09:00'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 상태 충돌 — 에이전트 실행이 아직 완료되지 않음(`REVIEW` 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RUN_NOT_COMPLETED
                message: 에이전트 실행이 완료되지 않아 승인 요청을 제출할 수 없습니다.
                details:
                  run_id: RUN-0042
                  overall_status: RUNNING
        '422':
          description: 누락 정보 — 서류 `missing` 항목이 남아 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: MISSING_INFORMATION
                message: 서류 누락 항목을 보완해야 승인 요청을 제출할 수 있습니다.
                details:
                  missing:
                    - doc_id: DOC-0101
                      type: WORK_PERMIT
                      fields: [작업자 2명 이름]

  /work-requests/{id}/approvals:
    parameters:
      - $ref: '#/components/parameters/WorkRequestId'
    post:
      tags: [approvals]
      summary: 승인 / 반려 / 보완요청 결정 등록
      description: |
        안전관리자의 결정(`APPROVE` | `REJECT` | `REQUEST_INFO`)을 등록한다 (UC-04).
        승인 규칙: `checklist` 4항목(`WORK_PERMIT`, `RISK_ASSESSMENT`, `LOTO_GAS_ISOLATION`, `GAS_DETECTOR_CHECK`)이 모두 `true` 가 아니면 `APPROVE` 는 **409**.
        결정에 따라 작업요청 상태는 `APPROVED` / `REJECTED` / (REQUEST_INFO 시) `REVIEW` 로 전이된다.
      operationId: createApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreate'
            example:
              approver_id: U-002
              decision: APPROVE
              checklist:
                WORK_PERMIT: true
                RISK_ASSESSMENT: true
                LOTO_GAS_ISOLATION: true
                GAS_DETECTOR_CHECK: true
              comment: 작업자 명단 확인 완료. 승인.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: 등록된 승인 결정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              examples:
                default:
                  $ref: '#/components/examples/ApprovalExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 상태 충돌 — 필수 체크리스트 미완료 상태에서 `APPROVE` 시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CHECKLIST_INCOMPLETE
                message: 필수 체크리스트 4항목을 모두 확인해야 승인할 수 있습니다.
                details:
                  unchecked: [LOTO_GAS_ISOLATION, GAS_DETECTOR_CHECK]
        '422':
          $ref: '#/components/responses/ValidationError'

  /documents/{docId}:
    parameters:
      - name: docId
        in: path
        required: true
        description: 문서 ID
        schema:
          type: string
          example: DOC-0101
    get:
      tags: [documents]
      summary: 서류 초안 조회
      description: 에이전트가 생성한 작업허가서·위험성평가표·LOTO 체크리스트·RFQ 초안 본문과 누락 항목.
      operationId: getDocument
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 문서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              examples:
                default:
                  $ref: '#/components/examples/DocumentExample'
        '404':
          $ref: '#/components/responses/NotFound'

  /parts:
    get:
      tags: [parts]
      summary: 부품 목록 조회
      operationId: listParts
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 부품 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Part'
              examples:
                default:
                  $ref: '#/components/examples/PartListExample'

  /parts/{partId}/compatibility:
    parameters:
      - name: partId
        in: path
        required: true
        description: 부품 ID
        schema:
          type: string
          example: P-VLV-001
    get:
      tags: [parts]
      summary: 부품 호환표 조회
      description: 기준 부품과 대체 가능 부품 목록(등급·차이점·유독가스 라인 사용 가능 여부).
      operationId: getPartCompatibility
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 호환표
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartCompatibility'
              examples:
                default:
                  $ref: '#/components/examples/PartCompatibilityExample'
        '404':
          $ref: '#/components/responses/NotFound'

  /equipments:
    get:
      tags: [equipments]
      summary: 설비 목록 조회
      operationId: listEquipments
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 설비 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipment'
              examples:
                default:
                  $ref: '#/components/examples/EquipmentListExample'

  /laws/search:
    get:
      tags: [laws]
      summary: 법령 인덱스 검색
      description: 사내에 사전 적재된 법령 인덱스(법제처 API)에서 키워드·설비 유형·물질로 조문을 검색한다. 외부 전송 없음.
      operationId: searchLaws
      parameters:
        - name: q
          in: query
          description: 검색 키워드
          required: false
          schema:
            type: string
            example: 운전정지
        - name: equipmentType
          in: query
          description: 설비 유형
          required: false
          schema:
            type: string
            example: GAS_CABINET
        - name: substance
          in: query
          description: 취급 물질
          required: false
          schema:
            type: string
            example: SiH4
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LawSearchResult'
              examples:
                default:
                  $ref: '#/components/examples/LawSearchExample'
        '422':
          $ref: '#/components/responses/ValidationError'

  /dashboard/summary:
    get:
      tags: [dashboard]
      summary: 대시보드 KPI 요약
      description: 진행 중·승인 대기 건수, 평균 승인 소요시간(As-Is 168h 대비), 이번 달 완료, 반려 사유 TOP.
      operationId: getDashboardSummary
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: KPI 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
              examples:
                default:
                  $ref: '#/components/examples/DashboardSummaryExample'

  /tenants/{id}/ai-config:
    parameters:
      - name: id
        in: path
        required: true
        description: 테넌트 ID
        schema:
          type: string
          example: T-001
    get:
      tags: [tenants]
      summary: 테넌트 AI 설정 조회
      description: 에이전트별 provider(`LOCAL_LLM`/`AX_PLATFORM`/`OPENAI`), 모델명, 프롬프트 버전, 외부 전송 허용 여부.
      operationId: getAiConfig
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 에이전트별 AI 설정 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiConfig'
              examples:
                default:
                  $ref: '#/components/examples/AiConfigListExample'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [tenants]
      summary: 테넌트 AI 설정 전체 교체
      description: 에이전트별 AI 설정 배열을 통째로 교체한다(멱등). 온프레미스 기본값은 `provider=LOCAL_LLM`, `egress_allowed=false`.
      operationId: putAiConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AiConfig'
            examples:
              default:
                $ref: '#/components/examples/AiConfigListExample'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 저장된 AI 설정 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiConfig'
              examples:
                default:
                  $ref: '#/components/examples/AiConfigListExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  parameters:
    WorkRequestId:
      name: id
      in: path
      required: true
      description: 작업요청 ID
      schema:
        type: string
        example: WR-20260902-011

  responses:
    Unauthorized:
      description: 인증 실패 (Bearer 토큰 누락/만료)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: 인증이 필요합니다.
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: 요청한 리소스를 찾을 수 없습니다.
            details:
              id: WR-99999999-000
    ValidationError:
      description: 요청 본문/파라미터 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: 요청 값이 올바르지 않습니다.
            details:
              errors:
                - field: equipment_id
                  message: field required

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 사내 SSO 발급 JWT. 클레임 `role` 로 ENGINEER/SAFETY_MANAGER/BUYER/ADMIN 권한 판별. (PoC 에서는 Mock 토큰 허용)

  schemas:
    # ---------- 공통 / enum ----------
    Error:
      type: object
      description: 공통 오류 응답
      required: [code, message]
      properties:
        code:
          type: string
          description: 기계 판독용 오류 코드
          example: NOT_FOUND
        message:
          type: string
          description: 사람이 읽는 오류 메시지(한국어)
          example: 요청한 리소스를 찾을 수 없습니다.
        details:
          type: object
          description: 추가 정보(누락 항목, 현재 상태 등)
          additionalProperties: true
          nullable: true

    WorkRequestStatus:
      type: string
      description: 작업요청 상태 (상태머신 순서)
      enum: [REQUESTED, RUNNING, REVIEW, PENDING_APPROVAL, APPROVED, REJECTED, DONE]
      example: REQUESTED
    OverallStatus:
      type: string
      description: 에이전트 실행 전체 상태
      enum: [RUNNING, REVIEW, FAILED]
      example: REVIEW
    StepStatus:
      type: string
      description: 에이전트 step 상태
      enum: [PENDING, RUNNING, DONE, FAILED]
      example: DONE
    AgentType:
      type: string
      description: 에이전트 종류 (A1 규격·호환 / A2 법령 / A3 안전서류 / A4 벤더)
      enum: [SPEC, LEGAL, SAFETY_DOC, VENDOR]
      example: SPEC
    UserRole:
      type: string
      enum: [ENGINEER, SAFETY_MANAGER, BUYER, ADMIN]
      example: SAFETY_MANAGER
    Decision:
      type: string
      description: 승인 결정
      enum: [APPROVE, REJECT, REQUEST_INFO]
      example: APPROVE
    DocumentType:
      type: string
      enum: [WORK_PERMIT, RISK_ASSESSMENT, LOTO_CHECKLIST, RFQ]
      example: WORK_PERMIT
    PartGrade:
      type: string
      description: 부품 등급 (정품 / 호환품 / 리퍼비시)
      enum: [OEM, EQUIVALENT, REFURB]
      example: OEM
    AiProvider:
      type: string
      enum: [LOCAL_LLM, AX_PLATFORM, OPENAI]
      example: LOCAL_LLM
    ProcedurePhase:
      type: string
      description: 절차 시점 (작업 전 / 작업 중 / 작업 후)
      enum: [BEFORE, DURING, AFTER]
      example: BEFORE
    RequiredFlag:
      description: 필수 여부. 근거 조문을 찾지 못한 경우 `UNKNOWN` (안전관리자 확인 필요)
      oneOf:
        - type: boolean
        - type: string
          enum: [UNKNOWN]
      example: true

    # ---------- WorkRequest ----------
    WorkRequestCreate:
      type: object
      description: 작업요청 생성 요청 본문
      required: [equipment_id, part_id, symptom, requested_by]
      properties:
        equipment_id:
          type: string
          description: 대상 설비 ID
          example: EQ-GC-02
        part_id:
          type: string
          description: 교체 대상 부품 ID
          example: P-VLV-001
        symptom:
          type: string
          description: 증상
          example: 가스 유량 이상, 밸브 누설 의심
        site_check_note:
          type: string
          description: 현장 확인 메모
          nullable: true
          example: 현장 확인 결과 밸브 시트 마모
        requested_by:
          type: string
          description: 요청자(엔지니어) 사용자 ID
          example: U-001

    WorkRequest:
      type: object
      description: 작업요청
      required: [id, tenant_id, equipment_id, part_id, symptom, requested_by, status, created_at, updated_at]
      properties:
        id:
          type: string
          example: WR-20260902-011
        tenant_id:
          type: string
          example: T-001
        equipment_id:
          type: string
          example: EQ-GC-02
        part_id:
          type: string
          example: P-VLV-001
        symptom:
          type: string
          example: 가스 유량 이상, 밸브 누설 의심
        site_check_note:
          type: string
          nullable: true
          example: 현장 확인 결과 밸브 시트 마모
        requested_by:
          type: string
          example: U-001
        status:
          $ref: '#/components/schemas/WorkRequestStatus'
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T15:00:00+09:00'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-02T15:00:00+09:00'

    WorkRequestSummary:
      type: object
      description: 목록 화면용 요약 (설비 / 부품 / 상태 / 에이전트 진행률 / 승인자)
      required: [id, equipment_id, equipment_name, part_id, part_no, status, agent_progress, created_at]
      properties:
        id:
          type: string
          example: WR-20260902-011
        equipment_id:
          type: string
          example: EQ-GC-02
        equipment_name:
          type: string
          example: 가스캐비닛#2
        part_id:
          type: string
          example: P-VLV-001
        part_no:
          type: string
          example: VLV-SS316-1/4-NC
        symptom:
          type: string
          example: 가스 유량 이상, 밸브 누설 의심
        status:
          $ref: '#/components/schemas/WorkRequestStatus'
        agent_progress:
          type: object
          description: 에이전트 진행률 (DONE step 수 / 전체 step 수)
          required: [done, total]
          properties:
            done:
              type: integer
              minimum: 0
              maximum: 4
              example: 4
            total:
              type: integer
              example: 4
        approver_id:
          type: string
          nullable: true
          description: 승인자(안전관리자) ID — 승인 전에는 null
          example: U-002
        requested_by:
          type: string
          example: U-001
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T15:00:00+09:00'

    WorkRequestList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkRequestSummary'
        total:
          type: integer
          description: 필터 적용 후 전체 건수
          example: 5
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20

    WorkRequestDetail:
      allOf:
        - $ref: '#/components/schemas/WorkRequest'
        - type: object
          required: [latest_run, approvals]
          properties:
            equipment:
              $ref: '#/components/schemas/Equipment'
            part:
              $ref: '#/components/schemas/Part'
            requester:
              $ref: '#/components/schemas/UserRef'
            latest_run:
              type: object
              nullable: true
              description: 최신 에이전트 실행 (실행 전이면 null)
              allOf:
                - $ref: '#/components/schemas/AgentRun'
            approvals:
              type: array
              description: 승인 이력 (최신순)
              items:
                $ref: '#/components/schemas/Approval'
      description: 작업요청 상세 (최신 run, 승인 이력 포함)

    UserRef:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          example: U-001
        name:
          type: string
          example: 김민준
        role:
          $ref: '#/components/schemas/UserRole'

    SubmitApprovalBody:
      type: object
      description: 승인 요청 제출 시 누락 정보 보완 값 (에이전트 생성 서류의 missing 항목명 → 값)
      properties:
        missing_info:
          type: object
          description: 서류 누락 항목 보완 값. 키는 SafetyDocResult.documents[].missing 의 항목명
          additionalProperties:
            type: string
          example: { "작업자 2명 이름": "김민준, 박수진" }
        site_check_note:
          type: string
          nullable: true
          description: 현장 확인 메모 갱신(선택)
        note:
          type: string
          nullable: true
          description: 승인자에게 전달할 메모
          example: 작업자 명단 보완 완료

    # ---------- AgentRun ----------
    AgentRunAccepted:
      type: object
      description: 202 응답 — 실행 접수
      required: [run_id, overall_status]
      properties:
        run_id:
          type: string
          example: RUN-0042
        overall_status:
          type: string
          enum: [RUNNING]
          example: RUNNING

    AgentRun:
      type: object
      description: 오케스트레이터 실행 결과 (`agent_runs.steps_json` 직렬화)
      required: [run_id, work_request_id, overall_status, steps, approval_required_by, model_name, prompt_version, created_at]
      properties:
        run_id:
          type: string
          example: RUN-0042
        work_request_id:
          type: string
          example: WR-20260902-011
        overall_status:
          $ref: '#/components/schemas/OverallStatus'
        steps:
          type: array
          description: 에이전트 step 4개 (순서 고정 SPEC→LEGAL→SAFETY_DOC→VENDOR)
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/AgentStep'
        summary:
          type: string
          nullable: true
          description: 통합 요약 (모든 step 완료 후 생성)
          example: OEM 동일 규격 밸브 교체. 유독가스 라인이라 호환품 불가. 작업허가·위험성평가·LOTO 필수. 서류 초안 2건 생성, 작업자 명단만 보완 필요.
        approval_required_by:
          $ref: '#/components/schemas/UserRole'
        model_name:
          type: string
          example: mock-v1
        prompt_version:
          type: string
          example: replaceflow-v0.1
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T15:10:02+09:00'
        completed_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-02T15:11:30+09:00'

    AgentStep:
      type: object
      description: 개별 에이전트 step. `result` 는 `agent` 값에 따라 SpecResult / LegalResult / SafetyDocResult / VendorResult 중 하나.
      required: [agent, status]
      properties:
        agent:
          $ref: '#/components/schemas/AgentType'
        status:
          $ref: '#/components/schemas/StepStatus'
        started_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-02T15:10:03+09:00'
        completed_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-02T15:10:20+09:00'
        error:
          type: string
          nullable: true
          description: FAILED 시 오류 메시지
        result:
          type: object
          nullable: true
          description: 에이전트 결과 — `agent` 값에 따라 SpecResult / LegalResult / SafetyDocResult / VendorResult. PENDING/RUNNING 이면 null.
          anyOf:
            - $ref: '#/components/schemas/SpecResult'
            - $ref: '#/components/schemas/LegalResult'
            - $ref: '#/components/schemas/SafetyDocResult'
            - $ref: '#/components/schemas/VendorResult'
            - type: object
              nullable: true
              enum: [null]
              description: 아직 결과 없음

    SpecResult:
      type: object
      description: A1 규격·호환 에이전트 결과
      required: [spec_match, current_part, alternatives]
      properties:
        spec_match:
          type: boolean
          description: 요청 부품이 설비 BOM 규격과 일치하는지
          example: true
        current_part:
          type: string
          description: 현재 장착 부품 번호
          example: VLV-SS316-1/4-NC
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/AlternativePart'
        notes:
          type: string
          nullable: true
          description: 판정 근거 메모

    AlternativePart:
      type: object
      required: [part_no, grade, diff, allowed_for_toxic_gas]
      properties:
        part_no:
          type: string
          example: VLV-SS316-1/4-NC-EQ
        grade:
          $ref: '#/components/schemas/PartGrade'
        diff:
          type: string
          description: 기준 부품 대비 차이점
          example: 시트 재질 PCTFE→PTFE
        allowed_for_toxic_gas:
          type: boolean
          description: 유독가스 라인 사용 가능 여부
          example: false

    LegalResult:
      type: object
      description: A2 법령 에이전트 결과 — 조문 인용 없는 항목 금지
      required: [applicable_laws, required_procedures]
      properties:
        applicable_laws:
          type: array
          items:
            $ref: '#/components/schemas/LawCitation'
        required_procedures:
          type: array
          items:
            $ref: '#/components/schemas/RequiredProcedure'

    LawCitation:
      type: object
      required: [law, article, title]
      properties:
        law:
          type: string
          example: 산업안전보건기준에 관한 규칙
        article:
          type: string
          example: 제92조
        title:
          type: string
          example: 정비등의 작업 시의 운전정지 등
        quote:
          type: string
          description: 법령 인덱스 원문 발췌 (빈 문자열 허용)
          example: …운전을 정지하고 … 잠금장치 및 표지판을…
        law_index_id:
          type: string
          nullable: true
          description: law_index 테이블 ID (추적용)
          example: LAW-0002

    RequiredProcedure:
      type: object
      required: [name, phase, required]
      properties:
        name:
          type: string
          example: 작업허가서(가스 배관 작업)
        phase:
          $ref: '#/components/schemas/ProcedurePhase'
        required:
          $ref: '#/components/schemas/RequiredFlag'
        basis:
          type: string
          nullable: true
          description: 근거 조문 (예 "산업안전보건기준에 관한 규칙 제92조")
          example: 산업안전보건기준에 관한 규칙 제92조
        note:
          type: string
          nullable: true
          description: required=UNKNOWN 인 경우 안전관리자 확인 요청 문구

    SafetyDocResult:
      type: object
      description: A3 안전서류 에이전트 결과
      required: [documents]
      properties:
        documents:
          type: array
          items:
            type: object
            required: [doc_id, type, missing]
            properties:
              doc_id:
                type: string
                example: DOC-0101
              type:
                $ref: '#/components/schemas/DocumentType'
              missing:
                type: array
                description: 초안에서 채우지 못한 항목
                items:
                  type: string
                example: [작업자 2명 이름]

    VendorResult:
      type: object
      description: A4 벤더 에이전트 결과
      required: [rfq_doc_id, rfq_summary, lead_time_est_days]
      properties:
        rfq_doc_id:
          type: string
          description: RFQ 초안 문서 ID
          example: DOC-0103
        rfq_summary:
          type: string
          example: VLV-SS316-1/4-NC 2EA 견적·납기 요청
        lead_time_est_days:
          type: integer
          minimum: 0
          example: 3
        last_purchase:
          type: string
          format: date
          nullable: true
          example: '2026-02-14'
        stock:
          type: integer
          nullable: true
          description: 현재 재고
          example: 2

    # ---------- Approval ----------
    Checklist:
      type: object
      description: 필수 체크리스트 4항목 — 모두 true 여야 APPROVE 가능
      required: [WORK_PERMIT, RISK_ASSESSMENT, LOTO_GAS_ISOLATION, GAS_DETECTOR_CHECK]
      properties:
        WORK_PERMIT:
          type: boolean
          example: true
        RISK_ASSESSMENT:
          type: boolean
          example: true
        LOTO_GAS_ISOLATION:
          type: boolean
          example: true
        GAS_DETECTOR_CHECK:
          type: boolean
          example: true

    ApprovalCreate:
      type: object
      description: 승인 결정 요청 본문
      required: [approver_id, decision, checklist]
      properties:
        approver_id:
          type: string
          example: U-002
        decision:
          $ref: '#/components/schemas/Decision'
        checklist:
          $ref: '#/components/schemas/Checklist'
        comment:
          type: string
          nullable: true
          description: 엔지니어에게 바로 전달되는 코멘트
          example: 작업자 명단 확인 완료. 승인.

    Approval:
      type: object
      description: 승인 결정
      required: [approval_id, work_request_id, approver_id, decision, checklist, decided_at]
      properties:
        approval_id:
          type: string
          example: AP-0007
        work_request_id:
          type: string
          example: WR-20260902-011
        approver_id:
          type: string
          example: U-002
        decision:
          $ref: '#/components/schemas/Decision'
        checklist:
          $ref: '#/components/schemas/Checklist'
        comment:
          type: string
          nullable: true
          example: 작업자 명단 확인 완료. 승인.
        decided_at:
          type: string
          format: date-time
          example: '2026-09-02T16:20:00+09:00'

    # ---------- Document ----------
    Document:
      type: object
      description: 에이전트 생성 서류
      required: [doc_id, agent_run_id, type, body, missing, version]
      properties:
        doc_id:
          type: string
          example: DOC-0101
        agent_run_id:
          type: string
          example: RUN-0042
        work_request_id:
          type: string
          example: WR-20260902-011
        type:
          $ref: '#/components/schemas/DocumentType'
        title:
          type: string
          example: 작업허가서 — 가스캐비닛#2 밸브 교체
        body:
          type: string
          description: 초안 본문 (Markdown)
          example: "# 작업허가서\n\n- 설비: 가스캐비닛#2 (EQ-GC-02)\n- 작업: VLV-SS316-1/4-NC 교체\n- 물질: SiH4\n- 작업자: [ ] , [ ]\n- 사전 조치: 운전 정지, LOTO, 가스 차단·퍼지 확인 (산안규칙 제92조)"
        missing:
          type: array
          items:
            type: string
          example: [작업자 2명 이름]
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2026-09-02T15:11:05+09:00'

    # ---------- Law ----------
    LawArticle:
      type: object
      description: 법령 인덱스 조문 (law_index)
      required: [id, law, article, title, text]
      properties:
        id:
          type: string
          example: LAW-0002
        law:
          type: string
          example: 산업안전보건기준에 관한 규칙
        article:
          type: string
          example: 제92조
        title:
          type: string
          example: 정비등의 작업 시의 운전정지 등
        text:
          type: string
