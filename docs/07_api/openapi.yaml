openapi: 3.0.3
info:
  title: 부품 교체 요청·승인 시스템 API (Argus — 명칭 미확정, docs/CONTRACT.md 참고)
  version: 3.0.0
  description: |
    REQ-F-0001. 팀 「API 명세서 v1.0」+「FixGuide 데이터 모델 정의서 v3.0」+「WRA 화면정의서 v2.0」을 그대로 옮긴 `docs/CONTRACT.md` v3.0 기준.
    이 문서는 **명세서를 기계화한 것**이며 설계 판단을 새로 하지 않았다 — 원본과 다르면 원본(CONTRACT.md)이 맞다.

    - 인증: `POST /auth/signup`·`POST /auth/login` 을 제외한 전 API 에 `Authorization: Bearer {accessToken}` 필수.
    - ID: 전부 **UUID v4 문자열**(`WR-` 같은 접두어 ID 없음). 업무 식별자는 `requestNo`(`WR-YYYYMMDD-NNN`, 서버 채번)로 분리.
    - 필드 표기: **camelCase**.
    - 페이지네이션: `page`(0-base, 기본 0) · `size`(기본 20, 최대 100). 정렬 `sort=필드,asc|desc`(기본 `createdAt,desc`, 목록은 `submittedAt,desc`).
    - 권한: `ENGINEER` 는 본인 요청만 조회·수정, `SAFETY_MANAGER` 는 `PENDING` 이상 전체 조회·승인 — 위반 시 403.
    - 오류 응답은 **단일 포맷**(`{code, message, fieldErrors?}`) — FastAPI 기본 `{"detail": ...}` 아님. `docs/CONTRACT.md` §1.1·§6.
    - 에이전트 3종(A1 규격·호환/A2 법령/A3 안전서류). A1 부품 마스터·호환표 연동, A4 벤더 에이전트는 Phase 2.
    - **v3.0 범위에 없는 것(Phase 2로 삭제)**: 법령 검색, 부품/설비 마스터 조회, 서류 단건 조회, 테넌트 AI 설정 — v1.0/v2.0 초안에는 있었으나 팀 권위 문서(API 명세서 v1.0)에 없어 제거했다.
    - **주의(2026-09-03)**: BE(`backend/`)가 이 계약을 아직 구현 중이다. 이 문서는 CONTRACT.md §4 JSON 규칙을 그대로 옮긴 것이며 **실측 검증되지 않았다.** BE 완료 후 재검증 필요 — `docs/09_qa/postman_verification.md` §9 참고.
  contact:
    name: Argus Team (SKALA mini project)
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
security:
  - bearerAuth: []
servers:
  - url: http://localhost:8000/api/v1
    description: 로컬 개발 서버 (FastAPI)
  - url: https://{mockId}.mock.pstmn.io/api/v1
    description: Postman Mock Server
    variables:
      mockId:
        default: argus

tags:
  - name: auth
    description: 회원가입·로그인·내 정보 (API #1~3)
  - name: dashboard
    description: 역할별 KPI 요약 (API #4)
  - name: work-requests
    description: 작업요청 리소스 (API #5~10, #14)
  - name: agent-runs
    description: 에이전트 실행(오케스트레이터) — 비동기 폴링 (API #11~12)
  - name: agent-results
    description: 에이전트 결과 편집 — 전체 치환 (API #13)
  - name: approvals
    description: 안전관리자 승인/거절 (API #15)

paths:
  # ==================================================================== 1~3 auth
  /auth/signup:
    post:
      tags: [auth]
      summary: "#1 회원가입"
      description: |
        `name`(2~20자) · `email`(유니크) · `password`(8자 이상, 영문+숫자+특수문자) · `passwordConfirm` · `role`.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupBody'
            example:
              name: 김민준
              email: engineer@argus.test
              password: Passw0rd!
              passwordConfirm: Passw0rd!
              role: ENGINEER
      responses:
        '201':
          description: 생성된 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/UserExample'
        '400':
          description: 입력 검증 실패 (`VALIDATION_FAILED`) 또는 비밀번호 불일치 (`PASSWORD_MISMATCH`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_failed:
                  summary: VALIDATION_FAILED
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인해주세요
                    fieldErrors:
                      - { field: password, message: "8자 이상, 영문+숫자+특수문자를 포함해야 합니다" }
                password_mismatch:
                  summary: PASSWORD_MISMATCH
                  value:
                    code: PASSWORD_MISMATCH
                    message: 비밀번호가 일치하지 않습니다
                    fieldErrors:
                      - { field: passwordConfirm, message: "비밀번호 확인이 일치하지 않습니다" }
        '409':
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: EMAIL_ALREADY_EXISTS
                message: 이미 사용 중인 이메일입니다

  /auth/login:
    post:
      tags: [auth]
      summary: "#2 로그인"
      description: |
        성공 시 `redirectPath` 를 서버가 계산해 내려준다 — `ENGINEER`→`/home`, `SAFETY_MANAGER`→`/manage/requests`. 프론트는 그 값을 그대로 쓴다.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
            example:
              email: engineer@argus.test
              password: Passw0rd!
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                default:
                  $ref: '#/components/examples/LoginResponseExample'
        '401':
          description: 자격 증명 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: 이메일 또는 비밀번호가 올바르지 않습니다

  /auth/me:
    get:
      tags: [auth]
      summary: "#3 내 정보 조회"
      description: 새로고침·직접 URL 진입 시 역할별 GNB 렌더링용. AC 에는 없었으나 필요해 신설(CONTRACT §8-3).
      operationId: getMe
      responses:
        '200':
          description: 현재 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/UserExample'
        '401':
          description: 토큰 만료 또는 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                expired:
                  summary: TOKEN_EXPIRED
                  value: { code: TOKEN_EXPIRED, message: 토큰이 만료되었습니다 }
                invalid:
                  summary: TOKEN_INVALID
                  value: { code: TOKEN_INVALID, message: 인증 토큰이 필요합니다 }

  # ==================================================================== 4 dashboard
  /dashboard/summary:
    get:
      tags: [dashboard]
      summary: "#4 대시보드 KPI 요약 (역할별)"
      description: |
        `role` 필수. 토큰 역할과 불일치하면 **403**.
        `role=engineer` → 작성중·진행중(AI)·승인대기·반려보완 4개(평균 승인 소요시간 없음).
        `role=safety` → 승인대기·오늘처리·이번달승인·이번달거절 + `rejectReasonsTop`(TOP5).
      operationId: getDashboardSummary
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [engineer, safety]
            example: engineer
      responses:
        '200':
          description: KPI 요약 — `role` 값에 따라 스키마가 달라진다
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EngineerDashboard'
                  - $ref: '#/components/schemas/SafetyDashboard'
              examples:
                engineer:
                  summary: role=engineer
                  $ref: '#/components/examples/EngineerDashboardExample'
                safety:
                  summary: role=safety
                  $ref: '#/components/examples/SafetyDashboardExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 토큰 역할과 `role` 쿼리 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN_ROLE
                message: 토큰 역할과 요청한 대시보드 역할이 다릅니다

  # ==================================================================== 5~10, 14 work-requests
  /work-requests:
    post:
      tags: [work-requests]
      summary: "#5 작업요청 생성"
      description: |
        `draft=false` 일 때만 `equipment`·`line`·`substance`·`operatingCondition`·`productName`·`productType`·`specJson` 필수.
        `draft=true` 면 전부 선택이고 상태만 `DRAFT`. `symptom`·`siteMemo` 는 항상 선택.
        `specJson` 은 `productType` 별 필수 키를 서버가 검증한다 — 불일치 시 **400 `SPEC_SCHEMA_MISMATCH`**(CONTRACT §2 표).
      operationId: createWorkRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequestCreateBody'
            examples:
              submit:
                summary: 제출 (draft=false)
                value:
                  draft: false
                  equipment: 가스캐비닛#2
                  line: A라인
                  substance: SiH4
                  operatingCondition: { temperature: 상온, pressure: 3000 psi }
                  productName: SS-8-VCR
                  productType: VALVE
                  specJson: { pressureRating: 3000 psi }
                  symptom: 가스 유량 이상, 밸브 누설 의심
                  siteMemo: 현장 확인 결과 밸브 시트 마모
              draft:
                summary: 임시 저장 (draft=true)
                value:
                  draft: true
                  productName: REG-2S
      responses:
        '201':
          description: 생성된 작업요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestDetail'
              examples:
                default:
                  $ref: '#/components/examples/WorkRequestDetailExample'
        '400':
          description: 필수값 누락(`VALIDATION_FAILED`) 또는 `specJson` 이 `productType` 필수 키와 불일치(`SPEC_SCHEMA_MISMATCH`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_failed:
                  summary: VALIDATION_FAILED (실측)
                  value:
                    code: VALIDATION_FAILED
                    message: "필수 입력값이 비어 있습니다: equipment, line, substance, operatingCondition, productType, specJson"
                    fieldErrors:
                      - { field: equipment, message: 필수 항목 }
                      - { field: line, message: 필수 항목 }
                      - { field: substance, message: 필수 항목 }
                      - { field: operatingCondition, message: 필수 항목 }
                      - { field: productType, message: 필수 항목 }
                      - { field: specJson, message: 필수 항목 }
                spec_schema_mismatch:
                  summary: SPEC_SCHEMA_MISMATCH (실측)
                  value:
                    code: SPEC_SCHEMA_MISMATCH
                    message: "VALVE 유형은 pressureRating 키가 필요합니다"
                    fieldErrors:
                      - { field: specJson.pressureRating, message: 필수 항목 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
    get:
      tags: [work-requests]
      summary: "#6 작업요청 목록 조회"
      description: |
        `status` 는 콤마로 다중 지정 가능(예 `REJECTED,DRAFT`). 응답은 `content[]` + `page{}`.
        각 항목에 서버가 계산한 **`nextAction`** 포함 — `DRAFT`→이어서(E_02) · `AI_RUNNING`→진행(E_03) · `AI_DONE`→결과(E_04) · 그 외→상세.
        빈 목록도 200 + `content: []`.
      operationId: listWorkRequests
      parameters:
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
            example: true
        - name: status
          in: query
          required: false
          description: 콤마 다중 지정 (예 `REJECTED,DRAFT`)
          schema:
            type: string
            example: PENDING
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          description: "`필드,asc|desc` — 기본 `createdAt,desc` (목록은 `submittedAt,desc`)"
          schema:
            type: string
            example: submittedAt,desc
      responses:
        '200':
          description: 작업요청 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestPage'
              examples:
                default:
                  $ref: '#/components/examples/WorkRequestPageExample'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /work-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkRequestId'
    get:
      tags: [work-requests]
      summary: "#7 작업요청 상세 조회"
      description: |
        `agentRun`(steps·results) + `approval`(최신 1건, 미처리 시 `null`) 포함.
        **SAFETY_MANAGER 조회 시 `agentRun.results[].editable` 은 항상 `false`.**
      operationId: getWorkRequest
      responses:
        '200':
          description: 작업요청 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestDetail'
              examples:
                default:
                  $ref: '#/components/examples/WorkRequestDetailExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: ENGINEER 가 본인 소유가 아닌 요청 조회
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN_NOT_OWNER
                message: 본인이 등록한 요청만 조회할 수 있습니다
        '404':
          $ref: '#/components/responses/WorkRequestNotFound'
    patch:
      tags: [work-requests]
      summary: "#8 작업요청 부분 수정"
      description: |
        가능 필드 — `equipment` `line` `substance` `operatingCondition` `productName` `productType` `specJson` `symptom` `siteMemo` `engineerNote`.
        `PENDING`·`APPROVED` 상태는 수정 불가(**409 `IMMUTABLE_STATUS`**).
      operationId: patchWorkRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequestPatchBody'
            example:
              engineerNote: 압력 등급 상향 반영, 제38조 작업허가 필요 판단.
      responses:
        '200':
          description: 수정된 작업요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestDetail'
              examples:
                default:
                  $ref: '#/components/examples/WorkRequestDetailExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인 요청이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN_NOT_OWNER
                message: 본인 요청만 수정할 수 있습니다
        '404':
          $ref: '#/components/responses/WorkRequestNotFound'
        '409':
          description: "`PENDING`/`APPROVED` 상태는 수정 불가"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IMMUTABLE_STATUS
                message: "APPROVED 상태의 요청은 수정할 수 없습니다"  # 실측 — 메시지에 실제 현재 상태값이 들어간다(PENDING이면 그 값으로)

  /work-requests/{id}/photos:
    parameters:
      - $ref: '#/components/parameters/WorkRequestId'
    post:
      tags: [work-requests]
      summary: "#9 제품 사진 업로드"
      description: |
        `multipart/form-data`, 파트명 **`files`(배열)**. jpg/png/webp, 파일당 **10MB**, 요청당 최대 **5장**.
        서버가 EXIF 를 제거하고 320px 썸네일을 생성한다.
      operationId: uploadPhotos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 이미지 파일 배열 (필드명 `files` 고정, 최대 5장)
      responses:
        '201':
          description: 업로드된 사진 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
              examples:
                default:
                  $ref: '#/components/examples/PhotoListExample'
        '400':
          description: 지원하지 않는 파일 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNSUPPORTED_FILE_TYPE
                message: "jpg/png/webp 만 업로드할 수 있습니다"
                fieldErrors:
                  - { field: "files[0]", message: "지원하지 않는 형식: image/gif" }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/WorkRequestNotFound'
        '409':
          description: 요청당 최대 5장 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PHOTO_LIMIT_EXCEEDED
                message: "사진은 요청당 최대 5장까지 업로드할 수 있습니다"
        '413':
          description: 파일당 10MB 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FILE_TOO_LARGE
                message: "파일당 최대 10MB 까지 업로드할 수 있습니다"
                fieldErrors:
                  - { field: "files[0]", message: "12.4MB — 10MB 초과" }
    get:
      tags: [work-requests]
      summary: "#10 제품 사진 목록 조회"
      description: 안전관리자 상세(S_02)의 썸네일·원본 열람용.
      operationId: listPhotos
      responses:
        '200':
          description: 사진 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
              examples:
                default:
                  $ref: '#/components/examples/PhotoListExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/WorkRequestNotFound'

  /work-requests/{id}/submit-approval:
    parameters:
      - $ref: '#/components/parameters/WorkRequestId'
    patch:
      tags: [work-requests]
      summary: "#14 승인 요청 제출 (AI_DONE/REJECTED → PENDING)"
      description: |
        서버 검증 4가지 — ①A1·A2·A3 결과 전부 존재 ②`engineerNote` 비어 있지 않음 ③A2 적용 법령 1건 이상 ④상태가 `AI_DONE` 또는 `REJECTED`.
        하나라도 실패하면 **422 `SUBMIT_REQUIRED_FIELD_MISSING`**.
        **재제출**: `REJECTED` 에서 동일 API 호출 시 `PENDING` 복귀, 직전 `approval` 이력은 보존(append-only).
      operationId: submitApproval
      responses:
        '200':
          description: 상태가 `PENDING` 으로 전이된 작업요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRequestDetail'
              example:
                id: b2b2b2b2-0000-4000-8000-000000000002
                workRequestId: b2b2b2b2-0000-4000-8000-000000000002
                requestNo: WR-20260903-011
                requesterId: a1a1a1a1-0000-4000-8000-000000000001
                requesterName: 김민준
                equipment: 가스캐비닛#2
                line: A라인
                substance: SiH4
                productName: SS-8-VCR
                productType: VALVE
                symptom: 가스 유량 이상, 밸브 누설 의심
                status: PENDING
                nextAction: DETAIL
                createdAt: '2026-09-03T15:00:00+09:00'
                updatedAt: '2026-09-03T15:30:00+09:00'
                submittedAt: '2026-09-03T15:30:00+09:00'
                operatingCondition: { temperature: 상온, pressure: 3000 psi }
                specJson: { pressureRating: 3000 psi }
                siteMemo: 현장 확인 결과 밸브 시트 마모
                engineerNote: 압력 등급 상향 반영, 제38조 작업허가 필요 판단.
                photos: []
                agentRun: null
                approval: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인 요청이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN_NOT_OWNER
                message: 본인 요청만 제출할 수 있습니다
        '404':
          $ref: '#/components/responses/WorkRequestNotFound'
        '422':
          description: 제출 조건 미충족
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_engineer_note:
                  summary: engineerNote 없음 (실측)
                  value:
                    code: SUBMIT_REQUIRED_FIELD_MISSING
                    message: 제출 요건을 충족하지 않았습니다
                    fieldErrors:
                      - { field: engineerNote, message: 엔지니어 노트를 작성해야 합니다 }
                missing_legal_citation:
                  summary: "A2 적용 법령 0건 (미실측 — 실제 fieldErrors 문구는 BE 재확인 필요, 메시지 패턴만 engineerNote 케이스에서 확인된 형태를 따랐다)"
                  value:
                    code: SUBMIT_REQUIRED_FIELD_MISSING
                    message: 제출 요건을 충족하지 않았습니다
                    fieldErrors:
                      - { field: agentResults.A2, message: "적용 법령이 1건 이상 필요합니다" }
                results_incomplete:
                  summary: "A1/A2/A3 결과 미완성 (미실측 — 메시지 패턴만 준용)"
                  value:
                    code: SUBMIT_REQUIRED_FIELD_MISSING
                    message: 제출 요건을 충족하지 않았습니다
                    fieldErrors:
                      - { field: agentResults, message: "A1·A2·A3 결과가 모두 필요합니다" }

  # ==================================================================== 11~12 agent-runs (최상위 경로)
  /agent-runs:
    post:
      tags: [agent-runs]
      summary: "#11 에이전트 실행 시작 (비동기) — /work-requests/{id}/agent-runs 아님"
      description: |
        body 는 `{workRequestId}` 뿐이다. **서버가 workRequestId 로 전체 스냅샷을 구성**해 에이전트에 보낸다
        (설비·라인·물질·운전조건·제품명·유형·스펙·사진 메타). 결과는 `GET /agent-runs/{runId}` 로 폴링한다.
      operationId: startAgentRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunCreateBody'
            example:
              workRequestId: b2b2b2b2-0000-4000-8000-000000000002
      responses:
        '202':
          description: |
            실행 접수됨. **실측(2026-09-03)** — 응답은 `{run_id, overall_status}` 같은 최소 요약이 아니라
            `GET /agent-runs/{runId}` 와 동일한 `AgentRunPollResponse` 전체(steps 3개 전부 `WAITING`)를 그대로 돌려준다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunPollResponse'
              example:
                id: c3c3c3c3-0000-4000-8000-000000000003
                runId: c3c3c3c3-0000-4000-8000-000000000003
                workRequestId: b2b2b2b2-0000-4000-8000-000000000002
                status: RUNNING
                steps:
                  - { agentCode: A1, status: WAITING, message: null, errorMessage: null, startedAt: null, finishedAt: null }
                  - { agentCode: A2, status: WAITING, message: null, errorMessage: null, startedAt: null, finishedAt: null }
                  - { agentCode: A3, status: WAITING, message: null, errorMessage: null, startedAt: null, finishedAt: null }
                allDone: false
                pollIntervalMs: 2500
                startedAt: '2026-09-03T15:10:02+09:00'
                finishedAt: null
        '400':
          description: 작업요청 필수값 미충족(생성 시 draft 로 남겨둔 채 실행 시도 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: WORK_REQUEST_INCOMPLETE
                message: "필수 입력값이 비어 있습니다: equipment, line, substance, operatingCondition, productType, specJson"
                fieldErrors:
                  - { field: equipment, message: 필수 항목 }
                  - { field: line, message: 필수 항목 }
                  - { field: substance, message: 필수 항목 }
                  - { field: operatingCondition, message: 필수 항목 }
                  - { field: productType, message: 필수 항목 }
                  - { field: specJson, message: 필수 항목 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/WorkRequestNotFound'
        '409':
          description: 이미 진행 중인 run 존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RUN_ALREADY_IN_PROGRESS
                message: 이미 진행 중인 AI 실행이 있습니다

  /agent-runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: c3c3c3c3-0000-4000-8000-000000000003
    get:
      tags: [agent-runs]
      summary: "#12 에이전트 실행 상태 조회 (폴링)"
      description: |
        응답에 `steps[]` · **`allDone`** · **`pollIntervalMs`**(서버 제공, 기본 2500ms). `allDone:true` 면 프론트는 폴링을 멈추고
        [결과 확인]을 활성화하며, 서버는 이 시점에 작업요청 상태를 `AI_DONE` 으로 전환한다.
        **step 실패 시 해당 step 만 `status:"FAILED"` + `errorMessage`, HTTP 는 200 유지**(전체 요청 실패로 취급하지 않는다).
      operationId: getAgentRun
      responses:
        '200':
          description: 에이전트 실행 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunPollResponse'
              examples:
                allDone_false:
                  summary: allDone=false (2/3 완료)
                  $ref: '#/components/examples/AgentRunPollingExample'
                allDone_true:
                  summary: allDone=true (3/3 완료)
                  $ref: '#/components/examples/AgentRunDoneExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: run 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AGENT_RUN_NOT_FOUND
                message: AI 실행 정보를 찾을 수 없습니다

  # ==================================================================== 13 agent-results
  /agent-results/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: agent_results.id (UUID)
        schema:
          type: string
          format: uuid
          example: d4d4d4d4-0000-4000-8000-000000000001
    patch:
      tags: [agent-results]
      summary: "#13 에이전트 결과 편집 — 전체 치환 (PUT-like)"
      description: |
        **전체 치환.** 배열에 없는 기존 `itemId`/`docId` 는 삭제되고, `itemId`/`docId` 없이 `text`/`content` 만 오면 신규 추가(서버 채번) —
        추가·삭제·편집을 1회 호출로 처리한다.
        - A1·A2 (항목형): `{ "items": [ {"itemId":"...", "text":"...", "edited":false} ] }`
        - A3 (문서형): `{ "documents": [ {"docId":"...", "type":"WORK_PERMIT", "name":"...", "content":"...", "edited":false} ] }`
        `PENDING`/`APPROVED` 이후는 **409 `RESULT_LOCKED`**.
      operationId: patchAgentResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentResultPatchBody'
            examples:
              itemType_A1:
                summary: A1/A2 — 항목형
                value:
                  items:
                    - { itemId: i-01, text: "규격 적합: 3000 psi ≥ 요구 2500 psi", edited: true }
                    - { text: "대체 호환: SS-8-VCR-2", edited: true }
              docType_A3:
                summary: A3 — 문서형
                value:
                  documents:
                    - { docId: d-01, type: WORK_PERMIT, name: 작업허가서 초안, content: "# 작업허가서\n...", edited: true }
      responses:
        '200':
          description: 치환된 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResult'
              examples:
                default:
                  $ref: '#/components/examples/AgentResultExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 본인 요청의 결과가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN_NOT_OWNER
                message: 본인 요청의 결과만 수정할 수 있습니다
        '404':
          description: 결과 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AGENT_RUN_NOT_FOUND
                message: AI 결과를 찾을 수 없습니다
        '409':
          description: "`PENDING`/`APPROVED` 이후 편집 시도"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RESULT_LOCKED
                message: "APPROVED 상태에서는 결과를 수정할 수 없습니다"  # 실측 — 메시지에 실제 현재 상태값이 들어간다

  # ==================================================================== 15 approvals (최상위 경로)
  /approvals:
    post:
      tags: [approvals]
      summary: "#15 승인 / 거절 — /work-requests/{id}/approvals 아님"
      description: |
        body `{workRequestId, decision, reason?, reasonCategory?}`. `reason` 은 `decision=REJECT` 일 때 필수, **10자 이상**.
        **체크리스트 blocking 없음** — 승인은 사유 없이 즉시, 거절만 사유 필수.
        `approvals` 는 append-only(재제출 후 재결정 시 새 행) — 이력은 `GET /work-requests/{id}` 의 `approval`(최신 1건)로 노출된다.
      operationId: createApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreateBody'
            examples:
              approve:
                summary: 승인
                value:
                  workRequestId: b2b2b2b2-0000-4000-8000-000000000002
                  decision: APPROVE
              reject:
                summary: 거절 (사유 10자 이상 필수)
                value:
                  workRequestId: b2b2b2b2-0000-4000-8000-000000000002
                  decision: REJECT
                  reason: "규격 부적합: 유독가스 라인에 호환품 사용 불가"
                  reasonCategory: SPEC_MISMATCH
      responses:
        '201':
          description: 등록된 승인 결정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              examples:
                default:
                  $ref: '#/components/examples/ApprovalExample'
        '400':
          description: "`decision=REJECT` 인데 `reason` 없음 또는 10자 미만"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: REJECT_REASON_REQUIRED
                message: 거절 사유는 10자 이상 입력해야 합니다
                fieldErrors:
                  - { field: reason, message: "10자 이상" }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: SAFETY_MANAGER 가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN_ROLE
                message: 안전관리자만 사용할 수 있는 기능입니다
        '404':
          $ref: '#/components/responses/WorkRequestNotFound'
        '409':
          description: "`PENDING` 상태가 아니거나(`NOT_PENDING`) 이미 결정됨(`ALREADY_DECIDED`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_pending:
                  summary: NOT_PENDING
                  value:
                    code: NOT_PENDING
                    message: 승인 대기 상태가 아닙니다
                already_decided:
                  summary: ALREADY_DECIDED
                  value:
                    code: ALREADY_DECIDED
                    message: 이미 결정된 요청입니다

components:
  parameters:
    WorkRequestId:
      name: id
      in: path
      required: true
      description: work_requests.id (UUID)
      schema:
        type: string
        format: uuid
        example: b2b2b2b2-0000-4000-8000-000000000002

  responses:
    Unauthorized:
      description: 인증 실패 — 토큰 없음/만료/무효
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            expired:
              summary: TOKEN_EXPIRED
              value: { code: TOKEN_EXPIRED, message: 토큰이 만료되었습니다 }
            invalid:
              summary: TOKEN_INVALID
              value: { code: TOKEN_INVALID, message: 인증 토큰이 필요합니다 }
    ForbiddenRole:
      description: 역할 권한 위반 (`FORBIDDEN_ROLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN_ROLE
            message: 해당 작업을 수행할 권한이 없습니다
    WorkRequestNotFound:
      description: 작업요청 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: WORK_REQUEST_NOT_FOUND
            message: 작업요청을 찾을 수 없습니다

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`POST /auth/login` 발급 JWT. `/auth/signup`·`/auth/login` 제외 전 API 필수(CONTRACT §1)."

  schemas:
    # ---------- 공통 / enum (docs/CONTRACT.md §2 그대로) ----------
    Error:
      type: object
      description: "모든 4xx·5xx 단일 포맷. `fieldErrors` 는 입력 유효성 오류(400·422)에서만 포함."
      required: [code, message]
      properties:
        code:
          type: string
          description: 오류 코드 (docs/CONTRACT.md §6 전체 목록)
          example: EMAIL_ALREADY_EXISTS
        message:
          type: string
          example: 이미 사용 중인 이메일입니다
        fieldErrors:
          type: array
          nullable: true
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: 중복된 이메일

    Role:
      type: string
      enum: [ENGINEER, SAFETY_MANAGER]
      example: ENGINEER
    WorkRequestStatus:
      type: string
      description: 작업요청 상태. CONTRACT §3 상태 전이도 참고.
      enum: [DRAFT, AI_RUNNING, AI_DONE, PENDING, APPROVED, REJECTED]
      example: PENDING
    ProductType:
      type: string
      enum: [VALVE, FITTING_TUBE, REGULATOR, FILTER, ETC]
      example: VALVE
    AgentCode:
      type: string
      description: "에이전트 3종. A1 규격·호환 / A2 법령·조문 / A3 안전서류. A4(벤더)는 Phase 2."
      enum: [A1, A2, A3]
      example: A1
    AgentStepStatus:
      type: string
      enum: [WAITING, RUNNING, DONE, FAILED]
      example: DONE
    RunStatus:
      type: string
      enum: [RUNNING, DONE, FAILED]
      example: RUNNING
    ApprovalDecision:
      type: string
      enum: [APPROVE, REJECT]
      example: APPROVE

    # ---------- Auth ----------
    SignupBody:
      type: object
      required: [name, email, password, passwordConfirm, role]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 20
          example: 김민준
        email:
          type: string
          format: email
          example: engineer@argus.test
        password:
          type: string
          format: password
          minLength: 8
          description: 영문+숫자+특수문자 포함 8자 이상
          example: Passw0rd!
        passwordConfirm:
          type: string
          format: password
          example: Passw0rd!
        role:
          $ref: '#/components/schemas/Role'

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: engineer@argus.test
        password:
          type: string
          format: password
          example: Passw0rd!

    LoginResponse:
      type: object
      description: "실측(2026-09-03, 라이브 캡처) — `user` 중첩 객체는 없다. 필드는 이 4개가 전부."
      required: [accessToken, tokenType, role, redirectPath]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2MDUyMzNlMi1hZTc2LTRiODUtOTEwMC02ZDJlNGJhYzcwYzQiLCJyb2xlIjoiRU5HSU5FRVIifQ.example
        tokenType:
          type: string
          enum: [Bearer]
          example: Bearer
        role:
          $ref: '#/components/schemas/Role'
        redirectPath:
          type: string
          description: "서버가 계산 — ENGINEER→/home, SAFETY_MANAGER→/manage/requests"
          example: /home

    User:
      type: object
      description: |
        `passwordHash` 는 어떤 응답에도 포함되지 않는다. 실측(2026-09-03) — 같은 값을 `id`/`userId` 두 키로 낸다(계약 §1
        은 한정명을, FE 는 `id` 를 쓴다는 BE 주석). `redirectPath` 도 이 응답에 포함된다(로그인 응답과 별개로 `/auth/me`·
        `/auth/signup` 에서도 매번 계산해 내려준다).
      required: [id, userId, name, email, role, redirectPath, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: a1a1a1a1-0000-4000-8000-000000000001
        userId:
          type: string
          format: uuid
          description: id 와 동일 값(중복 키)
          example: a1a1a1a1-0000-4000-8000-000000000001
        name:
          type: string
          example: 김민준
        email:
          type: string
          format: email
          example: engineer@argus.test
        role:
          $ref: '#/components/schemas/Role'
        redirectPath:
          type: string
          example: /home
        createdAt:
          type: string
          format: date-time
          example: '2026-09-03T09:00:00+09:00'

    # ---------- Dashboard ----------
    EngineerDashboard:
      type: object
      description: "role=engineer — 평균 승인 소요시간 없음(CONTRACT §4-4)."
      required: [draft, aiRunning, pending, rejected]
      properties:
        draft:
          type: integer
          description: 작성 중
          example: 2
        aiRunning:
          type: integer
          description: 진행 중(AI)
          example: 1
        pending:
          type: integer
          description: 승인 대기
          example: 3
        rejected:
          type: integer
          description: 반려·보완
          example: 1

    SafetyDashboard:
      type: object
      description: role=safety
      required: [pending, todayProcessed, monthApproved, monthRejected, rejectReasonsTop]
      properties:
        pending:
          type: integer
          example: 5
        todayProcessed:
          type: integer
          example: 7
        monthApproved:
          type: integer
          example: 42
        monthRejected:
          type: integer
          example: 6
        rejectReasonsTop:
          type: array
          description: TOP5
          items:
            type: object
            required: [reason, count]
            properties:
              reason:
                type: string
                example: 규격 부적합
              count:
                type: integer
                example: 9

    # ---------- WorkRequest ----------
    OperatingCondition:
      type: object
      description: jsonb — 구조 가변(CONTRACT §5 설계원칙 4)
      additionalProperties: true
      example: { temperature: 상온, pressure: 3000 psi }

    WorkRequestCreateBody:
      type: object
      description: |
        `draft=false` 일 때만 `equipment`~`specJson` 이 필수(문서상 정보로만 표현 — pydantic 조건부 검증은 서비스 계층, CONTRACT §5).
        OpenAPI 스키마 레벨에서는 `draft` 만 명시적으로 필수이고 나머지는 선택으로 두었다.
      required: [draft]
      properties:
        draft:
          type: boolean
          example: false
        equipment:
          type: string
          example: 가스캐비닛#2
        line:
          type: string
          example: A라인
        substance:
          type: string
          example: SiH4
        operatingCondition:
          $ref: '#/components/schemas/OperatingCondition'
        productName:
          type: string
          example: SS-8-VCR
        productType:
          $ref: '#/components/schemas/ProductType'
        specJson:
          type: object
          description: "`productType` 별 필수 키는 CONTRACT §2 표 참고"
          additionalProperties: true
          example: { pressureRating: 3000 psi }
        symptom:
          type: string
          nullable: true
          example: 가스 유량 이상, 밸브 누설 의심
        siteMemo:
          type: string
          nullable: true
          example: 현장 확인 결과 밸브 시트 마모

    WorkRequestPatchBody:
      type: object
      description: 부분 수정 — 전 필드 선택
      properties:
        equipment: { type: string, example: 가스캐비닛#2 }
        line: { type: string, example: A라인 }
        substance: { type: string, example: SiH4 }
        operatingCondition:
          $ref: '#/components/schemas/OperatingCondition'
        productName: { type: string, example: SS-8-VCR }
        productType:
          $ref: '#/components/schemas/ProductType'
        specJson:
          type: object
          additionalProperties: true
          example: { pressureRating: 3000 psi }
        symptom: { type: string, nullable: true, example: 가스 유량 이상, 밸브 누설 의심 }
        siteMemo: { type: string, nullable: true, example: 현장 확인 결과 밸브 시트 마모 }
        engineerNote:
          type: string
          nullable: true
          description: E_04 에서 엔지니어가 작성해 안전관리자에게 전달하는 설명
          example: 압력 등급 상향 반영, 제38조 작업허가 필요 판단.

    NextAction:
      type: string
      description: |
        목록 항목의 다음 액션 — 서버가 계산한다. `DRAFT`→`CONTINUE`(이어서 작성, E_02) · `AI_RUNNING`→`RUN`(진행 화면, E_03) ·
        `AI_DONE`→`RESULT`(결과 확인, E_04) · 그 외→`DETAIL`(상세). 값은 FE `constants/domain.js` 의 `NEXT_ACTION` 과 같은 어휘.
      enum: [CONTINUE, RUN, RESULT, DETAIL]
      example: DETAIL

    WorkRequestSummary:
      type: object
      description: |
        목록 항목이자 단일 리소스 응답(생성/조회/수정/제출)의 공통 베이스. 실측(2026-09-03) — **평탄화 구조이고
        같은 값을 `id`/`workRequestId` 두 키로 낸다.** v1.0 부터 유지된 관례(다른 리소스도 `id`+`{resource}Id` 쌍을
        쓴다 — `AgentResult.id`/`agentResultId`, `Approval.id`/`approvalId`, `Photo.id`/`photoId`).
      required: [id, workRequestId, requestNo, requesterId, productName, status, nextAction, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: b2b2b2b2-0000-4000-8000-000000000002
        workRequestId:
          type: string
          format: uuid
          description: id 와 동일 값(중복 키)
          example: b2b2b2b2-0000-4000-8000-000000000002
        requestNo:
          type: string
          description: "서버 채번 자연키 — `WR-YYYYMMDD-NNN`"
          example: WR-20260903-011
        requesterId:
          type: string
          format: uuid
          example: a1a1a1a1-0000-4000-8000-000000000001
        requesterName:
          type: string
          nullable: true
          example: 김민준
        equipment:
          type: string
          nullable: true
          example: 가스캐비닛#2
        line:
          type: string
          nullable: true
          example: A라인
        substance:
          type: string
          nullable: true
          example: SiH4
        productName:
          type: string
          nullable: true
          example: SS-8-VCR
        productType:
          $ref: '#/components/schemas/ProductType'
        symptom:
          type: string
          nullable: true
          example: 가스 유량 이상, 밸브 누설 의심
        status:
          $ref: '#/components/schemas/WorkRequestStatus'
        nextAction:
          $ref: '#/components/schemas/NextAction'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-03T15:00:00+09:00'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-03T15:00:00+09:00'
        submittedAt:
          type: string
          format: date-time
          nullable: true
          example: null

    PageInfo:
      type: object
      description: "0-base 페이지 정보. 정확한 필드명은 CONTRACT 원문에 없어 Spring Pageable 관례를 채택 — BE 확정 시 재검증 필요."
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          description: 현재 페이지 (0-base)
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 6
        totalPages:
          type: integer
          example: 1

    WorkRequestPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/WorkRequestSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    Photo:
      type: object
      description: |
        `backend/app/schemas/work_request.py` 의 `PhotoResponse` 기준(2026-09-03, 소스 대조 — 라이브 캡처는 아직 없음,
        photos 는 §13 E2E 시나리오에 포함되지 않았다). `id`/`photoId`/`workRequestId` 중복 키 관례는 다른 리소스와 동일.
        `originalUrl`/`thumbnailUrl` 은 `/uploads` 정적 마운트가 서빙하는, 화면에서 바로 쓰는 경로다.
      required: [id, photoId, workRequestId, fileName, size, storageKey, thumbnailKey, originalUrl, thumbnailUrl, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
          example: e5e5e5e5-0000-4000-8000-000000000001
        photoId:
          type: string
          format: uuid
          description: id 와 동일 값(중복 키)
          example: e5e5e5e5-0000-4000-8000-000000000001
        workRequestId:
          type: string
          format: uuid
          example: b2b2b2b2-0000-4000-8000-000000000002
        fileName:
          type: string
          example: valve.jpg
        size:
          type: integer
          description: 바이트
          example: 184320
        storageKey:
          type: string
          description: EXIF 제거된 원본 저장 경로 (내부용)
          example: photos/b2b2b2b2/valve.jpg
        thumbnailKey:
          type: string
          description: 320px 썸네일 저장 경로 (내부용)
          example: photos/b2b2b2b2/valve_thumb.jpg
        originalUrl:
          type: string
          description: 화면에서 바로 쓰는 원본 이미지 URL
          example: /uploads/photos/b2b2b2b2/valve.jpg
        thumbnailUrl:
          type: string
          description: 화면에서 바로 쓰는 썸네일 URL
          example: /uploads/photos/b2b2b2b2/valve_thumb.jpg
        uploadedAt:
          type: string
          format: date-time
          example: '2026-09-03T15:05:00+09:00'

    WorkRequestDetail:
      description: |
        `POST /work-requests`·`GET /work-requests/{id}`·`PATCH /work-requests/{id}`·`PATCH .../submit-approval` 이
        전부 이 스키마 하나로 응답한다(실측 확인 — v3.0 초안 때 가정했던 별도의 얇은 `WorkRequest` 스키마는 실제로
        없다. BE 는 생성 시점에도 `WorkRequestDetail` 을 곧장 돌려준다).
      allOf:
        - $ref: '#/components/schemas/WorkRequestSummary'
        - type: object
          required: [operatingCondition, specJson, siteMemo, engineerNote, photos, agentRun, approval]
          properties:
            operatingCondition:
              type: object
              nullable: true
              additionalProperties: true
              example: { temperature: 상온, pressure: 3000 psi }
            specJson:
              type: object
              nullable: true
              additionalProperties: true
              example: { pressureRating: 3000 psi }
            siteMemo:
              type: string
              nullable: true
              example: 현장 확인 결과 밸브 시트 마모
            engineerNote:
              type: string
              nullable: true
              example: 압력 등급 상향 반영, 제38조 작업허가 필요 판단.
            photos:
              type: array
              items:
                $ref: '#/components/schemas/Photo'
            agentRun:
              type: object
              nullable: true
              description: 최신 에이전트 실행 (실행 전이면 null)
              allOf:
                - $ref: '#/components/schemas/AgentRunEmbedded'
            approval:
              type: object
              nullable: true
              description: 최신 승인/거절 1건 — 미처리 시 null
              allOf:
                - $ref: '#/components/schemas/Approval'

    # ---------- AgentRun / Step / Result ----------
    AgentRunCreateBody:
      type: object
      required: [workRequestId]
      properties:
        workRequestId:
          type: string
          format: uuid
          example: b2b2b2b2-0000-4000-8000-000000000002

    AgentStep:
      type: object
      description: "실측(2026-09-03) — step 은 자기 `id` 를 갖지 않는다(`agent_steps` 행의 PK는 응답에 안 나옴). `agentCode` 로 구분한다."
      required: [agentCode, status]
      properties:
        agentCode:
          $ref: '#/components/schemas/AgentCode'
        status:
          $ref: '#/components/schemas/AgentStepStatus'
        message:
          type: string
          nullable: true
          maxLength: 200
          example: 규격 적합 판정 완료
        errorMessage:
          type: string
          nullable: true
          description: "`status=FAILED` 일 때만"
        startedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-03T15:10:03+09:00'
        finishedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-03T15:10:20+09:00'

    AgentRunPollResponse:
      type: object
      description: "GET /agent-runs/{runId} 응답. steps + allDone + pollIntervalMs(서버 제공). 실측(2026-09-03) — id/runId 중복 키, startedAt/finishedAt 은 run 레벨에도 있다."
      required: [id, runId, workRequestId, status, steps, allDone, pollIntervalMs, startedAt, finishedAt]
      properties:
        id:
          type: string
          format: uuid
          description: runId 와 동일 값(중복 키)
          example: c3c3c3c3-0000-4000-8000-000000000003
        runId:
          type: string
          format: uuid
          example: c3c3c3c3-0000-4000-8000-000000000003
        workRequestId:
          type: string
          format: uuid
          example: b2b2b2b2-0000-4000-8000-000000000002
        status:
          $ref: '#/components/schemas/RunStatus'
        steps:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentStep'
        allDone:
          type: boolean
          description: "true 면 프론트는 폴링 중단 + [결과 확인] 활성화. 서버는 이 시점에 work_request.status 를 AI_DONE 으로 전환."
          example: false
        pollIntervalMs:
          type: integer
          description: 서버가 권장하는 폴링 간격(ms)
          example: 2500
        startedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-03T15:10:02+09:00'
        finishedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-03T15:11:05+09:00'

    AgentResultItem:
      type: object
      description: A1/A2 항목형 결과 원소
      required: [itemId, text, edited]
      properties:
        itemId:
          type: string
          example: i-01
        text:
          type: string
          example: "규격 적합: 3000 psi ≥ 요구 2500 psi"
        edited:
          type: boolean
          default: false
          example: false

    AgentResultDocument:
      type: object
      description: A3 문서형 결과 원소
      required: [docId, type, name, content, edited]
      properties:
        docId:
          type: string
          example: d-01
        type:
          type: string
          description: "WORK_PERMIT / RISK_ASSESSMENT / LOTO_CHECKLIST"
          example: WORK_PERMIT
        name:
          type: string
          example: 작업허가서 초안
        content:
          type: string
          description: Markdown 본문
          example: "# 작업허가서\n\n- 설비: 가스캐비닛#2\n..."
        edited:
          type: boolean
          default: false
          example: false

    AgentResultPayload:
      description: "`agentCode` 에 따라 items(A1/A2) 또는 documents(A3) 중 하나"
      oneOf:
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AgentResultItem'
        - type: object
          required: [documents]
          properties:
            documents:
              type: array
              items:
                $ref: '#/components/schemas/AgentResultDocument'

    AgentResultPatchBody:
      $ref: '#/components/schemas/AgentResultPayload'

    AgentResult:
      type: object
      description: |
        agent_results 행. 실측(2026-09-03) — 필드명은 `payloadJson`(v3.0 초안의 `payload` 아님), `id`/`agentResultId`
        중복 키, **`runId` 필드는 없다**(v3.0 초안엔 있었으나 실제 응답엔 없음). `editable` 은 WorkRequestDetail 조회
        맥락에서만 의미 있고(SAFETY_MANAGER 조회 시 항상 false), 이 리소스 단건 응답에서는 요청자 기준으로 채워진다.
      required: [id, agentResultId, agentCode, payloadJson, edited, editable, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: d4d4d4d4-0000-4000-8000-000000000001
        agentResultId:
          type: string
          format: uuid
          description: id 와 동일 값(중복 키)
          example: d4d4d4d4-0000-4000-8000-000000000001
        agentCode:
          $ref: '#/components/schemas/AgentCode'
        payloadJson:
          $ref: '#/components/schemas/AgentResultPayload'
        edited:
          type: boolean
          example: true
        editable:
          type: boolean
          description: "WorkRequestDetail.agentRun.results[] 맥락에서만 의미 있음. SAFETY_MANAGER 조회 시 항상 false(CONTRACT §4-7)."
          example: true
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-03T15:12:00+09:00'

    AgentRunEmbedded:
      type: object
      description: "WorkRequestDetail.agentRun — AgentRunPollResponse 와 동일 필드 + results(편집 가능한 최종 산출물)."
      allOf:
        - $ref: '#/components/schemas/AgentRunPollResponse'
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/AgentResult'

    # ---------- Approval ----------
    ApprovalCreateBody:
      type: object
      required: [workRequestId, decision]
      properties:
        workRequestId:
          type: string
          format: uuid
          example: b2b2b2b2-0000-4000-8000-000000000002
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
        reason:
          type: string
          nullable: true
          minLength: 10
          description: "decision=REJECT 면 필수, 10자 이상"
          example: "규격 부적합: 유독가스 라인에 호환품 사용 불가"
        reasonCategory:
          type: string
          nullable: true
          description: "고정 enum 여부 팀 확인 필요(CONTRACT §8-6) — 자유 입력값으로 우선 개방"
          example: SPEC_MISMATCH

    Approval:
      type: object
      description: "실측(2026-09-03) — `id`/`approvalId` 중복 키(다른 리소스와 동일 관례)."
      required: [id, approvalId, workRequestId, approverId, decision, decidedAt]
      properties:
        id:
          type: string
          format: uuid
          example: 77777777-0000-4000-8000-000000000001
        approvalId:
          type: string
          format: uuid
          description: id 와 동일 값(중복 키)
          example: 77777777-0000-4000-8000-000000000001
        workRequestId:
          type: string
          format: uuid
          example: b2b2b2b2-0000-4000-8000-000000000002
        approverId:
          type: string
          format: uuid
          example: a2a2a2a2-0000-4000-8000-000000000002
        approverName:
          type: string
          nullable: true
          example: 이정호
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
        reason:
          type: string
          nullable: true
          example: "규격 부적합: 유독가스 라인에 호환품 사용 불가"
        reasonCategory:
          type: string
          nullable: true
          example: SPEC_MISMATCH
        decidedAt:
          type: string
          format: date-time
          example: '2026-09-03T16:20:00+09:00'

