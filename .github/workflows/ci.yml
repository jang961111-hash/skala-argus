name: CI

# push · PR 둘 다에서 돈다 — develop/main 모두 대상 (docs/01_planning/github_guide.md 브랜치 전략과 일치)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-test:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # backend/requirements.txt 주석: "Requires Python >= 3.10 (PEP 604 str | None)"
      # 3.11로 고정 — 팀원 로컬 macOS 기본 python3(3.9)에서는 이 워크플로가 그대로 재현되지 않으니 주의
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # frontend/package-lock.json 이 레포에 커밋되어 있어 npm ci 사용 (재현 가능한 설치)
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E (live, v3.0)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # scripts/e2e_live_v3.sh 는 backend/.venv/bin/python 을 하드코딩해서 찾는다 —
      # 그래서 pip install 을 러너 전역이 아니라 반드시 backend/.venv 안에 해야 한다
      - name: Set up backend/.venv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # scripts/e2e_live.sh(v1.0)는 docs/CONTRACT.md v3.0 기준으로 무효 — v3.0 계약을
      # 실측하는 scripts/e2e_live_v3.sh 를 돌린다 (docs/10_project_record/RECORD_KEEPING.md 참고).
      # collect_evidence.sh 는 여기서 안 쓴다 — pytest·FE build 를 앞의 두 잡이 이미 각자
      # 실행 중이라 그걸 다시 돌리면 잡 경계가 흐려지고, docs/10_project_record/02_evidence 아래
      # 파일을 만들어 커밋 유도 위험까지 있다. 이 잡은 라이브 E2E 스크립트만 직접 실행한다.
      - name: Run live E2E v3.0 (scripts/e2e_live_v3.sh)
        run: bash scripts/e2e_live_v3.sh | tee /tmp/e2e_live_v3.log

      # CI 증거는 리포에 커밋하지 않는다 — Actions 아티팩트로만 남긴다
      # (docs/10_project_record/RECORD_KEEPING.md §2 "원본 로그를 남긴다" 를 커밋 없이 만족)
      - name: Upload E2E log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-v3-log
          path: /tmp/e2e_live_v3.log
          retention-days: 14
